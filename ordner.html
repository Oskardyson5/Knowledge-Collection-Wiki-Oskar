<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">

    <title>Wiki Oskar</title>
</head>

<body>
    <div id="nameStep">
     <h1>Neuen Ordner erstellen</h1>
     <p>Wie soll der Ordner heißen?</p>
     <input class="Eingabefeld" type="text" id="NewfolderName" placeholder="Ordnername">
     <button class="choosebutton" id="nextButton"><h2>Weiter</h2></button>
    </div>

    <div id="pathStep" style="display:none;">
     <h1>Speicherort auswählen</h1>
     <p>Wähle den Parent-Ordner deines Ordners.</p>
 
     <button class="nav-button" id="backPathButton">← Zurück</button>
     <h2 id="folder-title"></h2>
     <div id="folder-tree"></div>
    </div>
    <script src="script.js"></script>
</body>

</html>
