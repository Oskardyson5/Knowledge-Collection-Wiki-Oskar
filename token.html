<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <title>GitHub Token</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <h1 class="title">
        GitHub Verbindung
    </h1>


    <p>
        Gib deinen GitHub Token ein:
    </p>


    <input 
        class="Eingabefeld"
        type="password"
        id="tokenInput"
        placeholder="GitHub Token"
    >


    <button 
        class="nav-button"
        id="saveTokenButton"
    >
        Token speichern
    </button>


    <script src="github.js"></script>
    <script src="token.js"></script>


</body>

</html>
